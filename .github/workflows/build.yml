name: Build APK

# اجرای دستی از تب Actions، یا با ساخت تگ مثل v2.4.0
# نسخه‌ی انتشار فقط با کلید امضای ثابت و کلید RSA بازار ساخته می‌شود (Secrets زیر)؛
# برای Pull Request فقط نسخه‌ی debug ساخته می‌شود و به هیچ Secret ای نیاز ندارد.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
      # اختیاری؛ اگر نگذارید پیش‌فرض‌ها (sms_monthly و sms_yearly) استفاده می‌شود
      SKU_MONTHLY: ${{ vars.SKU_MONTHLY }}
      SKU_YEARLY: ${{ vars.SKU_YEARLY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ران‌ر ubuntu-latest از قبل Android SDK دارد؛ اکشن setup-android با cmdline-tools جدید خطا می‌دهد
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # --- Pull Request: فقط debug، بدون Secret
      - name: Build debug APK
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle assembleDebug

      # --- انتشار: کلید امضای ثابت لازم است. کلید موقت = امضای متفاوت در هر build = بازار بروزرسانی را قبول نمی‌کند
      - name: Require signing secrets
        if: ${{ github.event_name != 'pull_request' && env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::Secret با نام KEYSTORE_BASE64 (و KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD و BAZAAR_RSA_KEY) تنظیم نشده. README را ببینید."
          exit 1

      - name: Restore release keystore
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        if: ${{ github.event_name != 'pull_request' }}
        run: gradle assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: SmsForwarder-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: SmsForwarder-debug
          path: app/build/outputs/apk/debug/*.apk

      # با ساخت تگ (مثل v2.4.0) APK در صفحه‌ی Releases هم منتشر می‌شود؛ لینک دانلود صفحه‌ی آپدیت همین‌جاست
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
